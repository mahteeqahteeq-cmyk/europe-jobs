<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Job Alerts - Germany, Poland, Netherlands Jobs</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4}
header{background:#1e2a5a;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:14px}
.container{max-width:800px;margin:15px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:3px 0;color:#444;font-size:14px}
.date{color:#0a7a42;font-weight:bold}
a{color:#1e2a5a;font-weight:bold}
#count{font-weight:bold;font-size:18px;margin:10px 0}
</style>
</head>
<body>
<header><h1>🇪🇺 Europe Job Alerts</h1><p>Germany | Poland | Netherlands | France | Czech Republic - Daily Updated</p></header>
<div class="container">
<div id="count">Loading Europe Jobs...</div>
<div id="jobs"></div>
</div>
<script>
const EUROPE = ["germany","poland","netherlands","france","czech","spain","italy","portugal","austria","belgium","sweden","denmark","finland","norway","ireland","greece","hungary","romania","croatia","slovakia","slovenia","lithuania","latvia","estonia","bulgaria","europe","eu","berlin","munich","hamburg","amsterdam","warsaw","paris","prague","vienna","madrid","lisbon","dublin","stockholm"];
const BAD = ["usa","united states","america","canada","australia","india","pakistan","worldwide"];
function isEurope(loc){
  loc = (loc||"").toLowerCase();
  if(BAD.some(w=>loc===w || loc.includes(" - usa") || loc.endsWith("usa"))) return false;
  if(loc==="worldwide") return false;
  return EUROPE.some(w=>loc.includes(w));
}
fetch("jobs.json?v="+Date.now()).then(r=>r.json()).then(data=>{
  let jobs = data.jobs || [];
  // Sirf Europe wali rakho, USA / Worldwide hata do
  let eu = jobs.filter(j=>isEurope(j.location));
  if(eu.length===0) eu = jobs.filter(j=>!BAD.some(w=>(j.location||"").toLowerCase().includes(w)));
  document.getElementById("count").textContent = "All Europe Jobs - " + eu.length + " | Updated: " + (data.lastUpdated||"").slice(0,10);
  document.getElementById("jobs").innerHTML = eu.map(j=>`
    <div class="card">
      <h3>${j.title||""}</h3>
      <p>${j.company||""} - ${j.location||"Europe"}</p>
      <p>${j.category||"General"} | ${j.salary||""}</p>
      <p class="date">📅 Date: ${j.date||(data.lastUpdated||"").slice(0,10)}</p>
      <p><a href="${j.url||"#"}" target="_blank">Apply Karein →</a></p>
    </div>`).join("") || "<p>No Europe jobs found today, please check tomorrow.</p>";
}).catch(e=>{
  document.getElementById("count").textContent = "Jobs load nahi hui, please refresh karein.";
});
</script>
</body>
</html>
