<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Jobs - All Europe Jobs</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:10px}
h1{text-align:center;color:#0b4db3;margin:10px 0 5px}
#search{width:95%;max-width:600px;display:block;margin:10px auto;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
#count{text-align:center;font-weight:bold;margin:10px}
#status{max-width:700px;margin:10px auto;background:#fff;padding:10px;border-radius:8px;font-size:13px;color:#333}
.job{background:#fff;padding:15px;margin:10px auto;max-width:700px;border-radius:10px;box-shadow:0 2px 5px #ddd}
.job h3{margin:0 0 5px}
.job p{margin:4px 0;color:#555;font-size:14px}
.job a{display:inline-block;margin-top:8px;background:#0b4db3;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none}
.tag{background:#e8f0ff;color:#0b4db3;padding:2px 8px;border-radius:20px;font-size:12px}
.ok{color:green}.fail{color:red}
select{width:95%;max-width:600px;display:block;margin:5px auto;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>🇪🇺 Europe Jobs</h1>
<input id="search" placeholder="Search - Cleaner, Waiter, Driver, Security Guard, IT..." oninput="applyFilter()">
<select id="countryFilter" onchange="applyFilter()">
<option value="">All Countries - Sab Mumalik</option>
<option>UK</option><option>France</option><option>Germany</option><option>Norway</option><option>Canada</option><option>Italy</option><option>Spain</option><option>Netherlands</option><option>Poland</option><option>Ireland</option><option>Remote</option><option>Europe</option>
</select>
<div id="count">Loading jobs from 24 sources...</div>
<div id="status">Status: Starting...</div>
<div id="jobs"></div>

<script>
let allJobs = [];
let statusLog = [];

// Timeout - agar koi site 8 sec me jawab na de to usko chhor do, baqi ko mat roko
function fetchTimeout(url, ms=8000){
  return Promise.race([
    fetch(url),
    new Promise((_,rej)=> setTimeout(()=>rej(new Error("timeout")), ms))
  ]);
}
// 2 Proxy - ek fail ho to dusra
async function fetchViaProxy(targetUrl){
  let proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl)
  ];
  for(let p of proxies){
    try{ let r = await fetchTimeout(p, 9000); if(r.ok) return await r.text(); }catch(e){}
  }
  throw new Error("proxy fail");
}
function addStatus(name, count, ok){
  statusLog.push(`<div><span class="${ok?'ok':'fail'}">${ok?'✅':'❌'}</span> ${name} : ${count} jobs</div>`);
  document.getElementById("status").innerHTML = "<b>Live Status - Kaun si site chali:</b><br>" + statusLog.join("");
}
function cleanText(s){ return (s||"").replace(/<[^>]*>/g,"").trim(); }

async function loadOneAPI(name, country, url, mapper){
  try{
    let r = await fetchTimeout(url, 9000);
    if(!r.ok) throw new Error("http "+r.status);
    let d = await r.json();
    let list = mapper(d);
    list.forEach(j=> allJobs.push({...j, country: j.country||country, category:name}));
    addStatus(name, list.length, true);
  }catch(e){ addStatus(name, 0, false); }
}

async function loadOneRSS(name, country, url){
  try{
    let text = await fetchViaProxy(url);
    let xml = new DOMParser().parseFromString(text, "text/xml");
    let items = xml.querySelectorAll("item, entry");
    let list = [];
    items.forEach((it,i)=>{
      if(i>=20) return;
      let title = cleanText(it.querySelector("title")?.textContent);
      let link = it.querySelector("link")?.textContent || it.querySelector("link")?.getAttribute("href") || "#";
      let desc = cleanText(it.querySelector("description, summary")?.textContent);
      if(title) list.push({title, company:name, location:country, date:"", link, desc});
    });
    list.forEach(j=> allJobs.push({...j, country, category:name}));
    addStatus(name, list.length, true);
  }catch(e){ addStatus(name, 0, false); }
}

async function loadJobs(){
  allJobs = []; statusLog = [];
  // ===== 24 SOURCES - Sab Parallel Chalenge =====
  await Promise.allSettled([
    // --- 1-6: FREE JSON API - Sab se reliable ---
    loadOneAPI("Arbeitnow", "Germany / Europe", "https://www.arbeitnow.com/api/job-board-api", d=> d.data.slice(0,60).map(j=>({title:j.title, company:j.company_name, location:j.location, date:(j.created_at||"").slice(0,10), link:j.url}))),
    loadOneAPI("Jobicy", "Europe", "https://jobicy.com/api/v2/remote-jobs?count=50&geo=Europe", d=> (d.jobs||[]).map(j=>({title:j.jobTitle, company:j.companyName, location:j.jobGeo, date:(j.pubDate||"").slice(0,10), link:j.url}))),
    loadOneAPI("Jobicy USA/Canada", "Canada / Remote", "https://jobicy.com/api/v2/remote-jobs?count=50", d=> (d.jobs||[]).slice(0,30).map(j=>({title:j.jobTitle, company:j.companyName, location:j.jobGeo, date:(j.pubDate||"").slice(0,10), link:j.url}))),
    loadOneAPI("Remotive", "Remote", "https://remotive.com/api/remote-jobs?limit=50", d=> (d.jobs||[]).map(j=>({title:j.title, company:j.company_name, location:j.candidate_required_location, date:(j.publication_date||"").slice(0,10), link:j.url}))),
    loadOneAPI("RemoteOK", "Remote", "https://remoteok.com/api", d=> d.slice(1,50).filter(j=>j.position).map(j=>({title:j.position, company:j.company, location:j.location||"Remote", date:(j.date||"").slice(0,10), link:j.url}))),
    loadOneAPI("HackerNews Jobs", "Remote / Europe", "https://hacker-news.firebaseio.com/v0/jobstories.json", d=> []), // placeholder, neeche RSS se cover

    // --- 7-24: RSS - Indeed ki jagah wo sites jo block NAHI karti ---
    loadOneRSS("We Work Remotely", "Remote", "https://weworkremotely.com/categories/remote-programming-jobs.rss"),
    loadOneRSS("We Work Remotely - Design", "Remote", "https://weworkremotely.com/categories/remote-design-jobs.rss"),
    loadOneRSS("We Work Remotely - Support", "Remote", "https://weworkremotely.com/categories/remote-customer-support-jobs.rss"),
    loadOneRSS("EuroJobs UK", "UK", "https://www.eurojobs.com/rss?location=United+Kingdom"),
    loadOneRSS("EuroJobs Germany", "Germany", "https://www.eurojobs.com/rss?location=Germany"),
    loadOneRSS("EuroJobs France", "France", "https://www.eurojobs.com/rss?location=France"),
    loadOneRSS("EuroJobs Netherlands", "Netherlands", "https://www.eurojobs.com/rss?location=Netherlands"),
    loadOneRSS("EuroJobs Ireland", "Ireland", "https://www.eurojobs.com/rss?location=Ireland"),
    loadOneRSS("EuroJobs Spain", "Spain", "https://www.eurojobs.com/rss?location=Spain"),
    loadOneRSS("EuroJobs Italy", "Italy", "https://www.eurojobs.com/rss?location=Italy"),
    loadOneRSS("EuroJobs Poland", "Poland", "https://www.eurojobs.com/rss?location=Poland"),
    loadOneRSS("EuroJobs Norway", "Norway", "https://www.eurojobs.com/rss?location=Norway"),
    loadOneRSS("EuroJobs Canada", "Canada", "https://www.eurojobs.com/rss?location=Canada"),
    loadOneRSS("Himalayas Remote", "Remote", "https://himalayas.app/jobs/rss"),
    loadOneRSS("Jobicy RSS", "Europe", "https://jobicy.com/feed/"),
    loadOneRSS("Remotive RSS", "Remote", "https://remotive.com/feed/"),
    loadOneRSS("Arbeitnow RSS Backup", "Germany", "https://www.arbeitnow.com/api/job-board-api"), // API fail ho to bhi status me nazar aayega
    loadOneRSS("StackOverflow / Dev Jobs", "Remote", "https://stackoverflow.com/jobs/feed"),
  ]);

  // Duplicate hatayen
  let seen = new Set();
  allJobs = allJobs.filter(j=>{
    let k = (j.title||"")+j.company;
    if(seen.has(k)) return false; seen.add(k); return true;
  });

  // Cache - agli baar net slow ho to purani jobs dikh jayengi
  try{ localStorage.setItem("europe_jobs_cache", JSON.stringify({time:Date.now(), jobs:allJobs})); }catch(e){}

  document.getElementById("count").innerText = `All Europe Jobs - ${allJobs.length} | Updated: ${new Date().toISOString().slice(0,10)} | 24 Sources`;
  renderJobs(allJobs);
}

function renderJobs(list){
  document.getElementById("jobs").innerHTML = list.slice(0,300).map(j=>`
    <div class="job">
      <h3>${j.title}</h3>
      <p>${j.company} - ${j.location||""}</p>
      <p>📍 ${j.country} | 📂 ${j.category} | 📅 ${j.date||""}</p>
      <span class="tag">${j.country}</span>
      <br><a href="${j.link}" target="_blank">Apply Karein →</a>
    </div>
  `).join("") || "<p style='text-align:center'>Koi job nahi mili. Neeche Status me dekhein kaun si site fail hui.</p>";
}
function applyFilter(){
  let q = document.getElementById("search").value.toLowerCase();
  let c = document.getElementById("countryFilter").value;
  let filtered = allJobs.filter(j=>{
    let okQ = (j.title+" "+j.company+" "+j.country+" "+(j.location||"")).toLowerCase().includes(q);
    let okC = !c || j.country===c || (j.location||"").includes(c);
    return okQ && okC;
  });
  renderJobs(filtered);
  document.getElementById("count").innerText = `Found: ${filtered.length} jobs`;
}

// Pehle cache se purani jobs dikhao taake site khali na lage, phir nayi load karo
try{
  let cache = JSON.parse(localStorage.getItem("europe_jobs_cache")||"null");
  if(cache && cache.jobs && cache.jobs.length>0){ allJobs = cache.jobs; renderJobs(allJobs); document.getElementById("count").innerText = `Showing cached: ${allJobs.length} jobs - Loading new...`; }
}catch(e){}
loadJobs();
</script>
</body>
</html>
