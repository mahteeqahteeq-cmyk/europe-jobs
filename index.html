<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Jobs - All Europe Jobs</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:10px}
h1{text-align:center;color:#0b4db3}
#search{width:95%;max-width:600px;display:block;margin:10px auto;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
#count{text-align:center;font-weight:bold;margin:10px}
#status{max-width:700px;margin:10px auto;background:#fff;padding:10px;border-radius:8px;font-size:13px}
.job{background:#fff;padding:15px;margin:10px auto;max-width:700px;border-radius:10px}
.job h3{margin:0 0 5px}
.job p{margin:4px 0;color:#555;font-size:14px}
.job a{display:inline-block;margin-top:8px;background:#0b4db3;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none}
.tag{background:#e8f0ff;color:#0b4db3;padding:2px 8px;border-radius:20px;font-size:12px}
.ok{color:green}.fail{color:red}
select{width:95%;max-width:600px;display:block;margin:5px auto;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>🇪🇺 Europe Jobs</h1>
<input id="search" placeholder="Search - Cleaner, Waiter, Driver, Security Guard, IT..." oninput="applyFilter()">
<select id="countryFilter" onchange="applyFilter()">
<option value="">All Countries</option>
<option>UK</option><option>France</option><option>Germany</option><option>Norway</option><option>Canada</option><option>Italy</option><option>Spain</option><option>Netherlands</option><option>Poland</option><option>Ireland</option><option>Remote</option><option>Europe</option><option>USA</option>
</select>
<div id="count">Loading jobs...</div>
<div id="status">Status: Starting...</div>
<div id="jobs"></div>
<script>
let allJobs=[]; let statusLog=[];
function fetchTimeout(url,ms=12000){ return Promise.race([fetch(url), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]); }

// FIX: AllOrigins /get/ wala data contents ke andar hota hai, usko kholna zaroori hai
function tryParseSmart(txt){
  txt=(txt||"").trim();
  try{
    let d=JSON.parse(txt);
    // Agar AllOrigins get format hai to andar contents me asli data hai
    if(d && typeof d.contents==="string"){
      try{ return JSON.parse(d.contents); }catch(e){ return d.contents; }
    }
    return d;
  }catch(e){ return txt; }
}
async function fetchSmart(url){
  // 1. Direct
  try{ let r=await fetchTimeout(url,8000); if(r.ok){ let t=await r.text(); if(t && t.length>100) return t; } }catch(e){}
  // 2. AllOrigins RAW
  try{ let r=await fetchTimeout("https://api.allorigins.win/raw?url="+encodeURIComponent(url),10000); if(r.ok){ let t=await r.text(); if(t && t.length>100) return t; } }catch(e){}
  // 3. AllOrigins GET - iska format alag hai, upar tryParseSmart kholega
  try{ let r=await fetchTimeout("https://api.allorigins.win/get?url="+encodeURIComponent(url),10000); if(r.ok){ let t=await r.text(); if(t && t.length>100) return t; } }catch(e){}
  // 4. Codetabs
  try{ let r=await fetchTimeout("https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url),10000); if(r.ok){ let t=await r.text(); if(t && t.length>100) return t; } }catch(e){}
  throw new Error("all fail");
}
function addStatus(name,count,ok){
  statusLog.push(`<div><span class="${ok?'ok':'fail'}">${ok?'✅':'❌'}</span> ${name} : ${count} jobs</div>`);
  document.getElementById("status").innerHTML="<b>Live Status:</b><br>"+statusLog.join("");
}
function clean(s){ return (s||"").replace(/<[^>]*>/g,"").trim(); }
async function loadJSON(name,country,url,mapper){
  try{
    let txt=await fetchSmart(url);
    let d=tryParseSmart(txt);
    // Agar d string hai to dobara parse karo
    if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(e){} }
    let list=mapper(d)||[];
    list.forEach(j=> allJobs.push({...j,country:j.country||country,category:name}));
    addStatus(name,list.length,list.length>0);
  }catch(e){ addStatus(name,0,false); }
}
async function loadRSS(name,country,url){
  try{
    let txt=await fetchSmart(url);
    let parsed=tryParseSmart(txt);
    let xmlText = typeof parsed==="string" ? parsed : txt;
    // Agar parsed object hai aur usme contents hai to wohi lo
    if(parsed && parsed.contents) xmlText=parsed.contents;
    let xml=new DOMParser().parseFromString(xmlText,"text/xml");
    let items=xml.querySelectorAll("item, entry");
    let list=[];
    items.forEach((it,i)=>{
      if(i>=25) return;
      let title=clean(it.querySelector("title")?.textContent);
      let link=it.querySelector("link")?.textContent || it.querySelector("link")?.getAttribute("href") || "#";
      link=link.trim();
      if(title && link!="#") list.push({title,company:name,location:country,date:"",link});
    });
    list.forEach(j=> allJobs.push({...j,country,category:name}));
    addStatus(name,list.length,list.length>0);
  }catch(e){ addStatus(name,0,false); }
}
async function loadJobs(){
  allJobs=[]; statusLog=[];
  await Promise.allSettled([
    loadJSON("Jobicy","Europe","https://jobicy.com/api/v2/remote-jobs?count=50&geo=Europe", d=>(d.jobs||[]).map(j=>({title:j.jobTitle,company:j.companyName,location:j.jobGeo,date:(j.pubDate||"").slice(0,10),link:j.url}))),
    loadJSON("Jobicy World","Remote","https://jobicy.com/api/v2/remote-jobs?count=50", d=>(d.jobs||[]).map(j=>({title:j.jobTitle,company:j.companyName,location:j.jobGeo,date:(j.pubDate||"").slice(0,10),link:j.url}))),
    loadJSON("Remotive","Remote","https://remotive.com/api/remote-jobs?limit=50", d=>(d.jobs||[]).map(j=>({title:j.title,company:j.company_name,location:j.candidate_required_location,date:(j.publication_date||"").slice(0,10),link:j.url}))),
    loadJSON("Remotive Marketing","Remote","https://remotive.com/api/remote-jobs?limit=50&category=marketing", d=>(d.jobs||[]).map(j=>({title:j.title,company:j.company_name,location:j.candidate_required_location,date:(j.publication_date||"").slice(0,10),link:j.url}))),
    loadJSON("Remotive Support","Remote","https://remotive.com/api/remote-jobs?limit=50&category=customer-service", d=>(d.jobs||[]).map(j=>({title:j.title,company:j.company_name,location:j.candidate_required_location,date:(j.publication_date||"").slice(0,10),link:j.url}))),
    loadJSON("RemoteOK","Remote","https://remoteok.com/api", d=>d.slice(1,60).filter(j=>j.position).map(j=>({title:j.position,company:j.company,location:j.location||"Remote",date:(j.date||"").slice(0,10),link:j.url}))),
    // FIXED Arbeitnow - ab /get/ format ko bhi kholega
    loadJSON("Arbeitnow","Germany / Europe","https://www.arbeitnow.com/api/job-board-api", d=>(d.data||[]).slice(0,80).map(j=>({title:j.title,company:j.company_name,location:j.location,date:(j.created_at||"").slice(0,10),link:j.url}))),
    loadJSON("HackerNews Jobs","Remote","https://hn.algolia.com/api/v1/search?query=job&tags=story&hitsPerPage=30", d=>(d.hits||[]).map(j=>({title:j.title,company:"HackerNews",location:"Remote",date:(j.created_at||"").slice(0,10),link:j.url||("https://news.ycombinator.com/item?id="+j.objectID)}))),
    loadRSS("We Work Remotely","Remote","https://weworkremotely.com/categories/remote-programming-jobs.rss"),
    loadRSS("WWR Support","Remote","https://weworkremotely.com/categories/remote-customer-support-jobs.rss"),
    loadRSS("WWR Design","Remote","https://weworkremotely.com/categories/remote-design-jobs.rss"),
    loadRSS("WWR All Jobs","Remote","https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"),
  ]);
  let seen=new Set();
  allJobs=allJobs.filter(j=>{ let k=(j.title||"")+j.company; if(seen.has(k)) return false; seen.add(k); return true; });
  try{ localStorage.setItem("europe_jobs_cache", JSON.stringify({time:Date.now(),jobs:allJobs})); }catch(e){}
  document.getElementById("count").innerText=`All Europe Jobs - ${allJobs.length} | Updated: ${new Date().toISOString().slice(0,10)} | 12 Real Sources`;
  renderJobs(allJobs);
}
function renderJobs(list){
  document.getElementById("jobs").innerHTML=list.slice(0,400).map(j=>`
    <div class="job"><h3>${j.title}</h3><p>${j.company} - ${j.location||""}</p><p>📍 ${j.country} | 📂 ${j.category} | 📅 ${j.date||""}</p><span class="tag">${j.country}</span><br><a href="${j.link}" target="_blank">Apply Karein →</a></div>
  `).join("") || "<p style='text-align:center'>Koi job nahi mili</p>";
}
function applyFilter(){
  let q=document.getElementById("search").value.toLowerCase();
  let c=document.getElementById("countryFilter").value;
  let f=allJobs.filter(j=>{ let okQ=(j.title+" "+j.company+" "+j.country+" "+(j.location||"")).toLowerCase().includes(q); let okC=!c || j.country===c || (j.location||"").includes(c); return okQ && okC; });
  renderJobs(f); document.getElementById("count").innerText=`Found: ${f.length} jobs`;
}
try{ let cache=JSON.parse(localStorage.getItem("europe_jobs_cache")||"null"); if(cache && cache.jobs && cache.jobs.length>0){ allJobs=cache.jobs; renderJobs(allJobs); document.getElementById("count").innerText=`Showing cached: ${allJobs.length} jobs - Loading new...`; } }catch(e){}
loadJobs();
</script>
</body>
</html>
