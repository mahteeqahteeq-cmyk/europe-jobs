window.CALC_SALARY=function(){
  var s=parseFloat(document.getElementById("salAmt").value||"0");
  var h=parseFloat(document.getElementById("salHours").value||"8");
  var d=parseFloat(document.getElementById("salDays").value||"26");
  var out=document.getElementById("salOut");
  if(!out){ return; }
  if(!s){ out.innerHTML="<p>Salary likhen.</p>"; return; }
  var perHour=(s/d/h).toFixed(2);
  var yearly=s*12;
  var pkr=Math.round(s*300);
  out.innerHTML="<div style='background:#ecfdf5;padding:14px;border-radius:10px;'><b>Result:</b><br>Monthly: <b>EUR "+s+"</b><br>Per Hour: <b>EUR "+perHour+"</b><br>Yearly: <b>EUR "+yearly+"</b><br>Pakistan Me Takreeban: <b>Rs "+pkr+" / Mahina</b> (1 EUR = 300 PKR andaza)</div>";
};

window.SAVE_25_JOB=function(){
  function val(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
  function fileName(id){ var e=document.getElementById(id); if(!e||!e.files||e.files.length==0) return "Not Uploaded"; return e.files[0].name; }
  var t=val("q1"), c=val("q2"), country=val("q3"), city=val("q4"), cat=val("q5"), ty=val("q6"), sal=val("q7"), apply=val("q22");
  var agree=document.getElementById("qAgree");
  if(!t){ alert("1. Job Title is required!"); return; }
  if(!c){ alert("2. Company Name is required!"); return; }
  if(!city){ alert("4. City is required!"); return; }
  if(!apply){ alert("22. Apply Link is required!"); return; }
  if(!val("q23")){ alert("23. Your Name is required!"); return; }
  if(!val("q24")){ alert("24. Your WhatsApp is required!"); return; }
  if(!val("q25")){ alert("25. Your Email is required!"); return; }
  if(!agree||!agree.checked){ alert("Please tick the box that job is real!"); return; }
  var posted=val("q20"), lastd=val("q21");
  var jobHtml="<div class='job' style='border-left:5px solid #16a34a'><b>"+t+" (Your Added Job)</b><br>"+c+" - "+country+" - "+city+" - "+ty+"<br><b>Posted:</b> "+(posted||"Today")+" | <b>Last:</b> "+(lastd||"Check Official Page")+"<br><b>Salary:</b> "+(sal?("EUR "+sal):"Check Official Page")+"<br><b>Passport File:</b> "+fileName("q13a")+" | <b>License File:</b> "+fileName("q13b")+"<br><b>Added By:</b> "+val("q23")+" - "+val("q24")+"<br><b>Description:</b> "+val("qDesc")+"<br><a href='"+apply+"' target='_blank'><button style='padding:8px 14px;background:#1e3a8a;color:white;border:none;border-radius:6px;margin-top:6px;'>Apply / View Real Job</button></a></div>";
  var job={t:t,c:c,co:country+" - "+city,cat:cat,ty:ty,u:apply,pd:posted||new Date(),last:lastd||"",sal:sal?("EUR "+sal):"Check Official Page",desc:val("qDesc")};
  try{ var list=JSON.parse(localStorage.getItem("myAddedJobs")||"[]"); list.unshift(job); localStorage.setItem("myAddedJobs",JSON.stringify(list)); }catch(e){}
  var listEl=document.getElementById("list");
  if(listEl){ listEl.innerHTML=jobHtml+listEl.innerHTML; }
  window.CLOSE_BIG();
  alert("Congratulations! Your job has been added!");
  window.scrollTo(0,0);
};
