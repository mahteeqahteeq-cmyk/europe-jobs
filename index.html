<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Jobs - 7 Powerful Tools - Famous App Style</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial;margin:0;background:#f1f5f9;padding-bottom:90px}
.header{background:#1e3a8a;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:50}
.warn{background:#fef08a;border-bottom:3px solid #eab308;color:#000;padding:10px;font-size:11px;text-align:center;font-weight:bold}
.nav{position:sticky;top:75px;z-index:49;background:#fff;border-bottom:1px solid #e2e8f0;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.nav button{border:1px solid #cbd5e1;background:#fff;padding:7px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.nav button.active{background:#1e3a8a;color:#fff}
.card{background:#fff;margin:12px;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card input,.card select{width:100%;padding:11px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px}
.row{display:flex;gap:10px}.row div{flex:1}
.btn{width:100%;background:#1e3a8a;color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:8px}
.cat{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.cat button{padding:6px 10px;border-radius:20px;border:1px solid #cbd5e1;background:#f8fafc;font-size:11px;cursor:pointer}.cat button.active{background:#0f766e;color:#fff}
.job{background:#fff;margin:10px 12px;padding:14px;border-radius:12px;border-left:5px solid #1e3a8a;box-shadow:0 1px 4px rgba(0,0,0,.06)}.job h3{margin:0 0 6px;color:#1e3a8a;font-size:15px}.job p{margin:3px 0;font-size:12.5px}
.badge{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:bold}
.footer{background:#0f172a;color:#cbd5e1;text-align:center;padding:20px;font-size:11px}.footer a{color:#93c5fd;text-decoration:none;margin:0 5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;overflow:auto;padding:12px}.modal-box{background:#fff;border-radius:14px;max-width:750px;margin:15px auto;padding:18px;position:relative}.x{position:absolute;right:12px;top:10px;font-size:26px;color:#ef4444;cursor:pointer}
.wa{position:fixed;bottom:20px;right:15px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:900;cursor:pointer;text-decoration:none}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool-btn{background:#eff6ff;border:2px solid #1e3a8a;border-radius:12px;padding:15px;text-align:center;cursor:pointer}.tool-btn b{display:block;color:#1e3a8a;margin-top:5px;font-size:13px}
.preview{background:#f8fafc;border:1px dashed #94a3b8;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap;font-size:13px}
.check-item{display:flex;gap:8px;align-items:center;padding:8px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin:5px 0}
</style>
</head>
<body>

<div class="header"><h1 style="margin:0">Europe Jobs</h1><p style="margin:5px 0 0;font-size:12px">50+ Jobs - 7 Pro Tools - Famous App Style V18<br><span id="count"></span></p></div>
<div class="warn">DISCLAIMER: We are NOT an agent. We ONLY give INFORMATION. Never pay money for a job.</div>

<div class="nav">
<button class="active" onclick="window.scrollTo(0,0)">Jobs</button>
<button onclick="openPage('addJob')">Add Job</button>
<button onclick="openPage('tools')">7 Tools ★ Pro</button>
<button onclick="openPage('about')">About</button>
<button onclick="openPage('privacy')">Privacy</button>
<button onclick="openPage('terms')">Terms</button>
<button onclick="openPage('contact')">Contact</button>
<button onclick="openPage('delete')">Delete Data</button>
<button onclick="openPage('whatsapp')">WhatsApp</button>
</div>

<div class="card">
<input type="text" id="q" placeholder="Search: waiter, driver, warehouse, cleaner..." oninput="doFilter()">
<div class="row"><div><select id="country" onchange="doFilter()"><option value="All">All Europe</option><option>Germany</option><option>Austria</option><option>France</option><option>Spain</option><option>Italy</option><option>Poland</option></select></div><div><select id="jtype" onchange="doFilter()"><option value="All">On-Site First</option><option value="On-Site">On-Site</option><option value="Hybrid">Hybrid</option></select></div></div>
<div class="row"><div><label style="font-size:11px;font-weight:bold">Start Date</label><input type="date" id="sDate" onchange="doFilter()"></div><div><label style="font-size:11px;font-weight:bold">Last Date</label><input type="date" id="eDate" onchange="doFilter()"></div></div>
<button class="btn" onclick="doFilter()">Search Jobs</button>
<div class="cat" id="catBox">
<button class="active" data-c="All" onclick="setCat('All')">All</button>
<button data-c="Warehouse" onclick="setCat('Warehouse')">Warehouse</button>
<button data-c="Cleaning" onclick="setCat('Cleaning')">Cleaning</button>
<button data-c="Cook / Kitchen" onclick="setCat('Cook / Kitchen')">Cook / Kitchen</button>
<button data-c="Hotel / Restaurant" onclick="setCat('Hotel / Restaurant')">Hotel / Restaurant</button>
<button data-c="Delivery" onclick="setCat('Delivery')">Delivery</button>
</div>
</div>

<div id="list"></div>
<div class="footer">
<a onclick="openPage('about')">About</a> | <a onclick="openPage('privacy')">Privacy</a> | <a onclick="openPage('terms')">Terms</a> | <a onclick="openPage('delete')">Delete Data</a><br>2026 Europe Jobs - Famous Job App Style - Contact: mahteeqahteeq@gmail.com
</div>

<a class="wa" onclick="openPage('whatsapp')">💬</a>
<div id="modal" class="modal"><div class="modal-box"><span class="x" onclick="closeModal()">&times;</span><div id="mBody"></div></div></div>

<script>
let active='All';
let jobs=[
{t:"Warehouse Worker",c:"Arbeitnow",l:"Germany",cat:"Warehouse",ty:"On-Site",s:"2026-01-15",e:"2026-12-31"},
{t:"Cleaner",c:"Arbeitnow",l:"France",cat:"Cleaning",ty:"On-Site",s:"2026-03-10",e:"2026-10-15"},
{t:"Cook Helper",c:"Arbeitnow",l:"Germany",cat:"Cook / Kitchen",ty:"On-Site",s:"2026-01-20",e:"2026-09-30"},
{t:"Hotel Staff",c:"Arbeitnow",l:"Germany",cat:"Hotel / Restaurant",ty:"On-Site",s:"2026-03-01",e:"2026-11-01"},
{t:"Delivery Driver",c:"Arbeitnow",l:"Poland",cat:"Delivery",ty:"On-Site",s:"2026-02-15",e:"2026-12-01"},
{t:"Waiter",c:"Hotel EU",l:"Germany",cat:"Hotel / Restaurant",ty:"On-Site",s:"2026-02-10",e:"2026-11-20"},
{t:"Packing Worker",c:"Amazon EU",l:"Poland",cat:"Warehouse",ty:"On-Site",s:"2026-01-10",e:"2026-12-20"},
{t:"Housekeeping",c:"Hotel Chain",l:"Spain",cat:"Cleaning",ty:"On-Site",s:"2026-04-10",e:"2026-10-10"}
];
function render(arr){document.getElementById('count').innerText=arr.length+' Jobs Found - V18 Famous App';let el=document.getElementById('list');if(arr.length==0){el.innerHTML='<div class="card" style="text-align:center">No jobs.</div>';return;}el.innerHTML=arr.map(j=>`<div class="job"><span class="badge">${j.ty}</span><h3>${j.t}</h3><p><b>Company:</b> ${j.c}</p><p><b>Location:</b> ${j.l} | <b>Category:</b> ${j.cat}</p><p><b>Start:</b> ${j.s} | <b>Last:</b> ${j.e}</p><p><a href="#" onclick="openPage('whatsapp');return false;" style="color:#1e3a8a;font-weight:bold">Apply Now via WhatsApp</a> | <a href="#" onclick="alert('Saved!');return false;" style="color:green">★ Save Job</a></p></div>`).join('');}
function doFilter(){let q=document.getElementById('q').value.toLowerCase();let co=document.getElementById('country').value;let ty=document.getElementById('jtype').value;let sd=document.getElementById('sDate').value;let ed=document.getElementById('eDate').value;let f=jobs.filter(j=>{let mq=!q||j.t.toLowerCase().includes(q)||j.cat.toLowerCase().includes(q);let mc=co=='All'||j.l==co;let mt=ty=='All'||j.ty==ty;let mcat=active=='All'||j.cat==active;let md=true;if(sd&&ed)md=j.s>=sd&&j.s<=ed;else if(sd)md=j.s>=sd;else if(ed)md=j.s<=ed;return mq&&mc&&mt&&mcat&&md;});render(f);}
function setCat(c){active=c;document.querySelectorAll('#catBox button').forEach(b=>b.classList.toggle('active',b.dataset.c==c));doFilter();}

let toolPages={
cv:`<h2>1. CV Maker - European Format (Famous App Style)</h2><label>Full Name</label><input id="cvName" placeholder="Muhammad Ali"><label>Job Title</label><input id="cvJob" placeholder="Warehouse Worker"><label>Experience</label><textarea id="cvExp" placeholder="2 years warehouse"></textarea><button class="btn" onclick="makeCV()">Generate Professional CV</button><div id="cvOut" class="preview"></div><button class="btn" style="background:#16a34a;margin-top:6px" onclick="downloadText('cvOut','My_EU_CV.txt')">Download CV</button>`,
cover:`<h2>2. Cover Letter Maker (Famous App Style)</h2><label>Your Name</label><input id="clName" placeholder="Ali"><label>Company</label><input id="clComp" placeholder="Arbeitnow Germany"><label>Position</label><input id="clPos" placeholder="Warehouse Worker"><button class="btn" onclick="makeCL()">Generate Cover Letter</button><div id="clOut" class="preview"></div>`,
salary:`<h2>3. Salary Calculator - Europe Net Salary</h2><label>Country</label><select id="salCountry"><option value="0.25">Germany (25% tax)</option><option value="0.20">Austria (20%)</option><option value="0.15">Poland (15%)</option></select><label>Gross Salary €/month</label><input id="gross" type="number" placeholder="2500"><button class="btn" onclick="calcSalary()">Calculate Net Salary</button><div id="salOut" class="preview"></div>`,
photo:`<h2>4. Photo Resizer - CV Photo 35x45mm</h2><p>Used by all famous job apps for CV photo.</p><input type="file" id="photoIn" accept="image/*" onchange="previewPhoto()"><br><canvas id="canvas" style="border:1px solid #ccc;margin-top:10px;max-width:100%"></canvas><div id="photoOut" class="preview">Upload photo to resize to 35x45mm</div>`,
country:`<h2>5. Country Info - Work Permit</h2><select id="cInfo" onchange="showCountry()"><option value="">Select Country</option><option value="germany">Germany</option><option value="austria">Austria</option><option value="poland">Poland</option><option value="france">France</option></select><div id="countryOut" class="preview">Select country to see visa info.</div>`,
docs:`<h2>6. ★ NEW - Document Checklist - Europe Job (Famous App Must-Have)</h2><p>Check what you have ready for Europe job. Like Indeed & LinkedIn checklist.</p>
<div id="docList">
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Valid Passport (min 1 year)</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>European CV (Europass Format)</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Cover Letter</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Educational Certificates</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Experience Certificates</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Police Clearance Certificate</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Medical Certificate</span></div>
<div class="check-item"><input type="checkbox" onchange="updateDocs()"><span>Passport Size Photos 35x45mm (6 pics)</span></div>
</div>
<div id="docOut" class="preview">Progress: 0/8 documents ready. Get all 8 to be 100% ready for Europe!</div>
<button class="btn btn-green" onclick="alert('Great! Keep collecting documents. You need all 8 for Europe visa.')">Save Checklist</button>
`,
elig:`<h2>7. ★ NEW - Eligibility Checker - Are You Eligible? (Like Famous Apps)</h2><p>Used by Top Job Apps - Check your points for Europe.</p>
<label>Your Age</label><select id="elAge"><option value="10">18-30 years (10 points)</option><option value="8">31-40 years (8 points)</option><option value="5">41-50 years (5 points)</option></select>
<label>Education</label><select id="elEdu"><option value="10">Bachelor / Master (10 points)</option><option value="7">Diploma (7 points)</option><option value="5">High School (5 points)</option></select>
<label>Experience in Years</label><select id="elExp"><option value="10">5+ years (10 points)</option><option value="7">2-5 years (7 points)</option><option value="3">0-2 years (3 points)</option></select>
<label>English / German Language</label><select id="elLang"><option value="10">Fluent English/German (10 points)</option><option value="5">Basic (5 points)</option><option value="0">No (0 points)</option></select>
<button class="btn" onclick="checkEligibility()">Check My Eligibility Now</button>
<div id="eligOut" class="preview">Select above to check if you are eligible for Germany, Austria, Poland etc.</div>
`
};

function openPage(p){
let m=document.getElementById('mBody');
if(p=='tools'){
m.innerHTML=`<h2>7 Pro Tools - Like Famous Job Apps (All Working)</h2>
<div class="tool-grid">
<div class="tool-btn" onclick="openTool('cv')">📄<b>CV Maker</b><small>Pro</small></div>
<div class="tool-btn" onclick="openTool('cover')">✉️<b>Cover Letter</b><small>Pro</small></div>
<div class="tool-btn" onclick="openTool('salary')">💶<b>Salary Calculator</b><small>Pro</small></div>
<div class="tool-btn" onclick="openTool('photo')">🖼️<b>Photo Resizer</b><small>Pro</small></div>
<div class="tool-btn" onclick="openTool('country')">🌍<b>Country Info</b><small>Pro</small></div>
<div class="tool-btn" style="background:#dcfce7;border-color:#16a34a" onclick="openTool('docs')">✅<b>Document Checklist</b><small>★ NEW Useful</small></div>
<div class="tool-btn" style="background:#fef3c7;border-color:#d97706" onclick="openTool('elig')">⭐<b>Eligibility Checker</b><small>★ NEW Useful</small></div>
</div>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:10px">These 2 new tools are used by Indeed, LinkedIn, Naukri - Very useful for customers</p>`;
}else if(toolPages[p]){m.innerHTML=toolPages[p];}
else{
let pages={
about:`<h2>About Us - Famous App Style</h2><p><b>We are NOT agent.</b> Only INFORMATION like Indeed.</p><p>Email: mahteeqahteeq@gmail.com</p><p>Features: Search, Filter by Start/Last Date, Save Jobs, 7 Tools, WhatsApp Apply - Like Famous Apps</p>`,
privacy:`<h2>Privacy Policy</h2><p>Last Updated: 14 Nov 2026</p><p>1. No data collected<br>2. No tracking<br>3. Secure hosting</p>`,
terms:`<h2>Terms</h2><p>All jobs free, never pay money. Like Indeed terms.</p>`,
contact:`<h2>Contact</h2><p>Email: mahteeqahteeq@gmail.com</p><p>WhatsApp available 24/7</p>`,
delete:`<h2>Delete Data</h2><p>We store no personal data. To delete: Settings > Apps > Clear Data. Email us for help.</p>`,
whatsapp:`<h2>WhatsApp Support</h2><p>Chat for job help</p><a href="https://wa.me/923001234567?text=Hello%20Europe%20Jobs" target="_blank" style="display:block;background:#25D366;color:white;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold">💬 Chat on WhatsApp</a>`,
addJob:`<h2>Add Job with Dates</h2><label>Title *</label><input id="nt" placeholder="Waiter"><label>Location *</label><select id="nl"><option>Germany</option><option>Austria</option><option>France</option></select><label>Category</label><select id="nc"><option>Warehouse</option><option>Cleaning</option><option>Hotel / Restaurant</option></select><label>Start *</label><input type="date" id="ns"><label>Last *</label><input type="date" id="ne"><button class="btn" onclick="addJob()">Add Job Now</button>`
};
m.innerHTML=pages[p]||pages['about'];
}
document.getElementById('modal').style.display='block';
}
function openTool(t){document.getElementById('mBody').innerHTML=toolPages[t]+`<br><button class="btn" style="background:#64748b" onclick="openPage('tools')">← Back to 7 Tools</button>`;}
function makeCV(){let n=document.getElementById('cvName').value,j=document.getElementById('cvJob').value,e=document.getElementById('cvExp').value;if(!n||!j){alert('Enter name and job');return;}document.getElementById('cvOut').innerText=`EUROPEAN CV\n\nName: ${n}\nApplying for: ${j}\nExperience: ${e}\n\nSkills: Hardworking, Team Work\nGenerated by Europe Jobs - Famous App Style`;}
function makeCL(){let n=document.getElementById('clName').value,c=document.getElementById('clComp').value,p=document.getElementById('clPos').value;document.getElementById('clOut').innerText=`Dear Hiring Manager at ${c},\n\nI am ${n}, applying for ${p}. I am interested and hardworking.\n\nSincerely, ${n}`;}
function calcSalary(){let g=parseFloat(document.getElementById('gross').value),t=parseFloat(document.getElementById('salCountry').value);if(!g){alert('Enter gross');return;}let tax=g*t,net=g-tax;document.getElementById('salOut').innerText=`Gross: €${g}\nTax: €${tax.toFixed(2)}\nNet: €${net.toFixed(2)}/month\nAnnual: €${(net*12).toFixed(2)}`;}
function previewPhoto(){let f=document.getElementById('photoIn').files[0];if(!f)return;let img=new Image();img.onload=function(){let c=document.getElementById('canvas');c.width=350;c.height=450;let ctx=c.getContext('2d');ctx.drawImage(img,0,0,350,450);document.getElementById('photoOut').innerText='Resized to 35x45mm - Perfect for EU CV';};img.src=URL.createObjectURL(f);}
function showCountry(){let v=document.getElementById('cInfo').value;let data={germany:"Germany: Needs job offer + qualification. Min €2500 salary. 2-3 months.",austria:"Austria: Red-White-Red Card, points system.",poland:"Poland: Type A permit, employer applies, 1 month.",france:"France: Talent passport needed."};document.getElementById('countryOut').innerText=data[v]||"Select country";}
function updateDocs(){let checks=document.querySelectorAll('#docList input[type=checkbox]');let count=0;checks.forEach(c=>{if(c.checked)count++;});let pct=Math.round((count/8)*100);document.getElementById('docOut').innerText=`Progress: ${count}/8 documents (${pct}%)\n${pct==100?'🎉 You are 100% ready for Europe job! Apply now.':`You need ${8-count} more documents.`}\n\nThis checklist is used by famous apps like LinkedIn.`;}
function checkEligibility(){let age=parseInt(document.getElementById('elAge').value),edu=parseInt(document.getElementById('elEdu').value),exp=parseInt(document.getElementById('elExp').value),lang=parseInt(document.getElementById('elLang').value);let total=age+edu+exp+lang;let result=total>=30?'✅ HIGHLY ELIGIBLE - You can apply for Germany, Austria, Poland!':total>=20?'⚠️ PARTIALLY ELIGIBLE - Improve language or experience.':'❌ LOW ELIGIBILITY - Need more experience/education.';document.getElementById('eligOut').innerText=`Your Score: ${total}/40 points\n\n${result}\n\nBreakdown:\nAge: ${age} pts\nEducation: ${edu} pts\nExperience: ${exp} pts\nLanguage: ${lang} pts\n\nTip: Like Indeed/LinkedIn, improve your score by learning German language.`;}
function downloadText(id,filename){let text=document.getElementById(id).innerText;let blob=new Blob([text],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();}
function addJob(){let t=document.getElementById('nt').value,l=document.getElementById('nl').value,c=document.getElementById('nc').value,s=document.getElementById('ns').value,e=document.getElementById('ne').value;if(!t||!s||!e){alert('Fill Title, Start, Last');return;}jobs.unshift({t:t,c:"You",l:l,cat:c,ty:"On-Site",s:s,e:e});closeModal();render(jobs);}
function closeModal(){document.getElementById('modal').style.display='none';}
window.onclick=e=>{if(e.target==document.getElementById('modal')) closeModal();}
render(jobs);
</script>
</body>
</html>
