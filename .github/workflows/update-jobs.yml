name: Daily Europe Jobs Update
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real jobs
        run: |
          python3 -c "
          import urllib.request, json
          url = 'https://remotive.com/api/remote-jobs?limit=100'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req, timeout=30).read())
          all_jobs = data.get('jobs', [])
          print(f'Total from API: {len(all_jobs)}')
          jobs = []
          for j in all_jobs:
              jobs.append({
                  'title': j.get('title',''),
                  'company': j.get('company_name',''),
                  'location': j.get('candidate_required_location','Remote'),
                  'category': j.get('category',''),
                  'type': j.get('job_type',''),
                  'salary': j.get('salary',''),
                  'url': j.get('url',''),
                  'date': j.get('publication_date','')[:10]
              })
              if len(jobs) >= 30:
                  break
          out = {'lastUpdated': __import__('datetime').datetime.utcnow().isoformat(), 'count': len(jobs), 'jobs': jobs}
          open('jobs.json','w').write(json.dumps(out, indent=2))
          print(f'Saved: {len(jobs)} jobs')
          "
      - name: Commit
        run: |
          git config user.name 'BunnyRunnerX'
          git config user.email 'bot@example.com'
          git add jobs.json
          git commit -m 'Update real jobs' || echo 'No changes'
          git push --force
