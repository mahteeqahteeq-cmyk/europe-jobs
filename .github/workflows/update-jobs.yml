name: Daily Europe Jobs Update
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real jobs
        run: |
          python3 -c "
          import urllib.request, json, datetime
          jobs = []
          today = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0', 'Accept':'application/json'})
              raw = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', errors='ignore')
              print('Got', url, 'len', len(raw))
              if not raw.strip().startswith('{'):
                  return {}
              return json.loads(raw)
          try:
              data = get_json('https://www.arbeitnow.com/api/job-board')
              for j in data.get('data', []):
                  loc = j.get('location','') or 'Germany'
                  jobs.append({'title': j.get('title',''), 'company': j.get('company_name',''), 'location': loc, 'category': j.get('job_types',[''])[0] if j.get('job_types') else 'General', 'type': j.get('job_types',[''])[0] if j.get('job_types') else 'Full-time', 'salary': j.get('salary',''), 'url': j.get('url',''), 'date': (j.get('created_at','') or today)[:10]})
                  if len(jobs) >= 30:
                      break
              print(f'Arbeitnow Europe: {len(jobs)}')
          except Exception as e:
              print('Arbeitnow failed:', e)
          if len(jobs) < 5:
              try:
                  data2 = get_json('https://jobicy.com/api/v2/remote-jobs?count=50&geo=Europe')
                  for j in data2.get('jobs', []):
                      loc = j.get('jobGeo','Europe') or 'Europe'
                      if isinstance(loc, list):
                          loc = ', '.join(loc)
                      jobs.append({'title': j.get('jobTitle',''), 'company': j.get('companyName',''), 'location': loc, 'category': j.get('jobIndustry',['General'])[0] if j.get('jobIndustry') else 'General', 'type': j.get('jobType','Full-time'), 'salary': j.get('jobSalary',''), 'url': j.get('url',''), 'date': (j.get('pubDate','') or today)[:10]})
                      if len(jobs) >= 30:
                          break
                  print(f'After Jobicy Europe: {len(jobs)}')
              except Exception as e:
                  print('Jobicy failed:', e)
          if len(jobs) < 5:
              print('Using Europe fallback')
              jobs = [{'title':'Warehouse Worker','company':'Euro Logistics','location':'Germany','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today},{'title':'Delivery Driver','company':'Euro Delivery','location':'Netherlands','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today},{'title':'Hotel Cleaner','company':'Euro Hotels','location':'Poland','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today},{'title':'Factory Helper','company':'Euro Factory','location':'Czech Republic','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today},{'title':'Kitchen Assistant','company':'Euro Foods','location':'France','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today},{'title':'Construction Worker','company':'Euro Build','location':'Germany','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':today}]
          out = {'lastUpdated': datetime.datetime.utcnow().isoformat()+'Z', 'jobs': jobs}
          open('jobs.json','w').write(json.dumps(out, indent=2))
          print(f'Saved Europe jobs: {len(jobs)}')
          "
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add jobs.json
          git commit -m "Update Europe jobs" || echo "no change"
          git push
