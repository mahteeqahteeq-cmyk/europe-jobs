name: Daily Europe Jobs Update
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real jobs
        run: |
          python3 -c "
          import urllib.request, json
          url = 'https://www.arbeitnow.com/api/job-board'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          data = json.loads(urllib.request.urlopen(req).read())
          all_jobs = data.get('data', [])
          print(f'Total from API: {len(all_jobs)}')
          jobs = []
          for j in all_jobs:
              jobs.append({
                  'title': j.get('title',''),
                  'company': j.get('company_name',''),
                  'location': j.get('location',''),
                  'category': j.get('job_types',[''])[0] if j.get('job_types') else 'General',
                  'type': j.get('job_types',[''])[0] if j.get('job_types') else 'Full-time',
                  'salary': j.get('salary',''),
                  'url': j.get('url',''),
                  'date': j.get('created_at','')
              })
              if len(jobs) >= 30:
                  break
          out = {'lastUpdated': __import__('datetime').datetime.utcnow().isoformat()+'Z', 'jobs': jobs}
          open('jobs.json','w').write(json.dumps(out, indent=2))
          print(f'Saved: {len(jobs)} jobs')
          "
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add jobs.json
          git commit -m "Update jobs" || echo "no change"
          git push
