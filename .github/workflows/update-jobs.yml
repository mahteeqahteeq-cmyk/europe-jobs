name: Daily Europe Jobs Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update jobs
        run: |
          echo "{\"lastUpdated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > jobs.json
          cat jobs.json
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add jobs.json
          git commit -m "jobs" || true
          git push
