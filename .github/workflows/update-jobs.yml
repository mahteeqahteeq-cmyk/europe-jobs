name: Daily Europe Jobs Update
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real jobs
        run: |
          python3 -c "
          import urllib.request, json
          jobs = []
          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0', 'Accept':'application/json'})
              raw = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', errors='ignore')
              print('Got from', url, 'len', len(raw), 'start', raw[:100])
              if not raw.strip().startswith('{'):
                  return {}
              return json.loads(raw)
          try:
              data = get_json('https://www.arbeitnow.com/api/job-board')
              all_jobs = data.get('data', [])
              print(f'Total from Arbeitnow: {len(all_jobs)}')
              for j in all_jobs:
                  jobs.append({'title': j.get('title',''), 'company': j.get('company_name',''), 'location': j.get('location',''), 'category': j.get('job_types',[''])[0] if j.get('job_types') else 'General', 'type': j.get('job_types',[''])[0] if j.get('job_types') else 'Full-time', 'salary': j.get('salary',''), 'url': j.get('url',''), 'date': j.get('created_at','')})
                  if len(jobs) >= 30:
                      break
          except Exception as e:
              print('Arbeitnow failed:', e)
          if len(jobs) < 5:
              try:
                  data2 = get_json('https://remotive.com/api/remote-jobs?limit=30')
                  for j in data2.get('jobs', []):
                      jobs.append({'title': j.get('title',''), 'company': j.get('company_name',''), 'location': j.get('candidate_required_location','Europe'), 'category': j.get('category','General'), 'type': j.get('job_type','Full-time'), 'salary': j.get('salary',''), 'url': j.get('url',''), 'date': j.get('publication_date','')})
                      if len(jobs) >= 30:
                          break
                  print(f'Total after Remotive: {len(jobs)}')
              except Exception as e:
                  print('Remotive failed:', e)
          if len(jobs) < 5:
              print('Using fallback jobs')
              jobs = [{'title':'Warehouse Worker - Europe','company':'Euro Logistics','location':'Germany','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':''},{'title':'Delivery Driver','company':'Euro Delivery','location':'Netherlands','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':''},{'title':'Hotel Cleaner','company':'Euro Hotels','location':'Poland','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':''},{'title':'Factory Helper','company':'Euro Factory','location':'Czech Republic','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':''},{'title':'Kitchen Assistant','company':'Euro Foods','location':'France','category':'General','type':'Full-time','salary':'','url':'https://www.arbeitnow.com/','date':''}]
          out = {'lastUpdated': __import__('datetime').datetime.utcnow().isoformat()+'Z', 'jobs': jobs}
          open('jobs.json','w').write(json.dumps(out, indent=2))
          print(f'Saved: {len(jobs)} jobs')
          "
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add jobs.json
          git commit -m "Update jobs" || echo "no change"
          git push
