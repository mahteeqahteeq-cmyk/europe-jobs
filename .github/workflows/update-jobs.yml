name: Daily Europe Jobs Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update jobs
        run: |
          echo '{"lastUpdated":"2026-05-13","total":2,"jobs":[{"title":"Factory Germany","company":"Factory","location":"Germany","salary":"1800 Euro","url":"https://arbeitnow.com"},{"title":"Warehouse Poland","company":"Logistics","location":"Poland","salary":"1200 Euro","url":"https://arbeitnow.com"}]}' > jobs.json
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add jobs.json
          git commit -m "jobs" || true
          git push
